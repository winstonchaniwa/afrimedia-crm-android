name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Debug build always works with zero setup — signed with the
      # well-known Android debug key, installable on your own phone
      # immediately (Settings > enable "install unknown apps" once).
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: afrimedia-crm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Optional: if you add a release signing key as repo secrets
      # (see README "Signing for real"), this also produces a
      # release-signed APK you could eventually submit to Play.
      - name: Build release APK
        if: ${{ vars.ENABLE_RELEASE_BUILD == 'true' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ vars.ENABLE_RELEASE_BUILD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: afrimedia-crm-release-apk
          path: app/build/outputs/apk/release/app-release.apk
